name: Debug tcgcsv.com

on:
  workflow_dispatch:
  push:
    branches: [claude/repository-push-5c1nqs]
    paths: [.github/workflows/debug-tcgcsv.yml]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Categories endpoint (plain)
        run: |
          echo "=== Response headers ==="
          curl -sSI "https://tcgcsv.com/tcgplayer/categories" || true
          echo
          echo "=== CORS preflight-style check (Origin header set) ==="
          curl -sSI -H "Origin: https://trentonxdavis.github.io" "https://tcgcsv.com/tcgplayer/categories" || true
          echo
          echo "=== Body (first 3000 chars) ==="
          curl -sS "https://tcgcsv.com/tcgplayer/categories" | head -c 3000 || true
          echo

      - name: Find One Piece category and inspect groups
        run: |
          BODY=$(curl -sS "https://tcgcsv.com/tcgplayer/categories")
          echo "$BODY" > categories.json
          echo "=== Matches for 'one piece' (case-insensitive) ==="
          python3 -c "
import json
data = json.load(open('categories.json'))
results = data.get('results', [])
print('total categories:', len(results))
matches = [c for c in results if 'one piece' in (c.get('name') or '').lower()]
print('matches:', matches)
"
