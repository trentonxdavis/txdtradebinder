name: Refresh live pricing

on:
  push:
    branches: [claude/repository-push-5c1nqs]
    paths:
      - collection.json
      - scripts/fetch_prices.py
      - .github/workflows/refresh-prices.yml
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live prices from tcgcsv.com
        run: python3 scripts/fetch_prices.py

      - name: Commit cards.json if it changed
        run: |
          if git diff --quiet -- cards.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards.json
          git commit -m "Refresh live card prices"
          git push
